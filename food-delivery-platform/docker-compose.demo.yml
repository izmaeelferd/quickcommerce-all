# LOCAL DEMO / TESTING ONLY — demo secrets, demo data, development mode. Never use in production.
# Start with ./scripts/demo.sh (Linux/macOS) or scripts\demo.ps1 (Windows); see TESTING.md.
# Needs the prebuilt web apps in demo/web/ (included in the all-in-one zip, or run scripts/build-web-demo.sh).
name: food-delivery-demo
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - demo_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/food_delivery_demo
      JWT_ACCESS_SECRET: demo_only_access_secret_change_for_real_use_0001
      JWT_REFRESH_SECRET: demo_only_refresh_secret_change_for_real_use_0002
      CLIENT_URLS: "*"
      # Image URLs. DEMO_HOST is this computer's LAN IP when testing from a phone.
      PUBLIC_BASE_URL: http://${DEMO_HOST:-localhost}:8080
      ADMIN_DEFAULT_EMAIL: admin@yourapp.com
      ADMIN_DEFAULT_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin@12345}
      SEED_SAMPLE_PASSWORD: Password@123
      # Sample restaurants are placed around this point (default: Bengaluru).
      SEED_LAT: ${DEMO_LAT:-12.9716}
      SEED_LNG: ${DEMO_LNG:-77.5946}
    volumes:
      - demo_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./demo/web:/usr/share/nginx/html:ro
    ports:
      - "${BIND_HOST:-127.0.0.1}:8080:8080"
      - "${BIND_HOST:-127.0.0.1}:5173:5173"
      - "${BIND_HOST:-127.0.0.1}:5174:5174"
    depends_on:
      - backend

volumes:
  demo_mongo:
  demo_uploads:
