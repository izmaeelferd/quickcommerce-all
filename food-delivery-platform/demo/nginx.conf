# Demo web server: serves every app and proxies the API, so each app talks to its own origin.
#   :8080/customer/  :8080/partner/  :8080/rider/   Flutter apps (web builds)
#   :5173            Admin panel
#   :5174            Vendor dashboard
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream api { server backend:5000; }

server {
  listen 8080;
  client_max_body_size 10m;
  root /usr/share/nginx/html;

  location /api/       { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /uploads/   { proxy_pass http://api; }
  location /socket.io/ { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }

  # One CanvasKit copy shared by the three Flutter builds.
  location ~ ^/(customer|partner|rider)/canvaskit/(.*)$ { alias /usr/share/nginx/html/canvaskit/$2; }
  location ~ ^/(customer|partner|rider)/ { try_files $uri $uri/ /$1/index.html; }
  location = / {
    default_type text/html;
    return 200 '<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Demo</title><body style="font-family:sans-serif;padding:24px;line-height:2"><h2>Food delivery demo</h2><a href="/customer/">Customer app</a><br><a href="/partner/">Partner (restaurant) app</a><br><a href="/rider/">Rider app</a><p>Admin panel: port 5173 &middot; Vendor dashboard: port 5174</p>';
  }
}

server {
  listen 5173;
  client_max_body_size 10m;
  root /usr/share/nginx/html/admin;
  location /api/       { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /uploads/   { proxy_pass http://api; }
  location /socket.io/ { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}

server {
  listen 5174;
  client_max_body_size 10m;
  root /usr/share/nginx/html/vendor;
  location /api/       { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /uploads/   { proxy_pass http://api; }
  location /socket.io/ { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
