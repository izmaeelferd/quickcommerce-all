;; QuickCart PgBouncer configuration (blueprint, PgBouncer 1.23).
;;
;; quickcart        transaction pooling for app_user and app_platform (all request and job traffic).
;;                  Tenant context is set per transaction with set_config('app.tenant_id', $1, true)
;;                  (equivalent to SET LOCAL), which is safe in transaction mode. See 06, section 10.6.
;; quickcart_admin  session pooling for the schema owner. Used only by the migrate job and the installer
;;                  (migrations take session-level advisory locks and run DDL).
;;
;; external-db deployments: replace host=postgres with the managed database host and add sslmode.

[databases]
quickcart = host=postgres port=5432 dbname=quickcart pool_mode=transaction
quickcart_admin = host=postgres port=5432 dbname=quickcart pool_mode=session pool_size=3

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 2000
default_pool_size = 40
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3
max_db_connections = 120

;; Protocol-level prepared statements in transaction mode (PgBouncer >= 1.21).
max_prepared_statements = 200

server_reset_query = DISCARD ALL
server_reset_query_always = 0
server_check_query = select 1
server_lifetime = 3600
server_idle_timeout = 600
query_wait_timeout = 30
client_idle_timeout = 0
idle_transaction_timeout = 60

ignore_startup_parameters = extra_float_digits,search_path,options

admin_users =
stats_users = pgbouncer_stats

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
